---
name: Fork CI monitor

"on":
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-ci-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'apache/hbase'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout trusted monitor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          persist-credentials: false
      - name: Report PR results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dev-support/fork_ci.py monitor

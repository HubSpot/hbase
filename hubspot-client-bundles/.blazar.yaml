buildpack:
  name: Blazar-Buildpack-Java-oss-fork

env:
  PRE_RUN_BEFORE_STEPS: false
  # Below variables are generated in prepare_environment.sh.
  # The build environment requires environment variables to be explicitly defined before they may
  # be modified by the `write-build-env-var` utilty script to persist changes to an environment variable
  # throughout a build
  REPO_NAME: ""
  SET_VERSION: ""
  HBASE_VERSION: ""
  PKG_RELEASE: ""
  FULL_BUILD_VERSION: ""
  MAVEN_BUILD_ARGS: ""

before:
  - description: "Prepare build environment"
    commands:
      - $WORKSPACE/build-scripts/prepare_environment.sh
  - description: "Set canonical Maven versions"
    commands:
      - |
          if [ "$GIT_BRANCH" = "hubspot-2.6" ]; then
            if [ "${SET_VERSION:-}" != "2.6-hubspot-SNAPSHOT" ]; then
              echo "Expected SET_VERSION=2.6-hubspot-SNAPSHOT after preparing the build environment" >&2
              exit 1
            fi
            "$JAVA_BUILDSCRIPTS_DIR/set_maven_versions.py" \
              --version "$SET_VERSION" \
              --root "$WORKSPACE" \
              --no-use-managed-versions \
              --no-use-version-overrides
          fi

depends:
  - hbase
provides:
  - hubspot-client-bundles
